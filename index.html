<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word finder</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --ink: #1c2230;
    --muted: #667085;
    --line: #d5d9e2;
    --accent: #2a4bd7;
    --accent-ink: #ffffff;
    --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --panel: #1a1f2a;
      --ink: #e6e9f0;
      --muted: #98a1b3;
      --line: #2e3544;
      --accent: #7f9bff;
      --accent-ink: #10131a;
      --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    padding: 24px 16px 64px;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }
  .modes { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
  .modes button {
    font: inherit; padding: 8px 18px; border: 0; background: transparent; color: var(--ink); cursor: pointer;
  }
  .modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .modes button:focus-visible, .go:focus-visible, input:focus-visible, .more:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink);
  }
  .go {
    font: inherit; padding: 10px 20px; border: 0; border-radius: 6px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .go:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: .9rem; margin: 10px 0 0; }
  .hint code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  #status { margin: 18px 0 8px; color: var(--muted); font-size: .95rem; }
  #status.error { color: var(--err); }
  #results {
    list-style: none; margin: 0; padding: 0;
    columns: 27ch; column-gap: 16px; /* 27ch fits the 25-letter max plus a little slack */
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #results li { break-inside: avoid; padding: 1px 0; overflow-wrap: anywhere; }
  .more {
    margin-top: 14px; font: inherit; padding: 8px 14px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <h1>Word finder</h1>
  <div class="panel">
    <div class="modes" role="group" aria-label="Mode">
      <button type="button" id="mode-filter" aria-pressed="true">Filter</button>
      <button type="button" id="mode-length" aria-pressed="false">Length</button>
      <button type="button" id="mode-includes" aria-pressed="false">Includes</button>
      <button type="button" id="mode-soft" aria-pressed="false">Soft includes</button>
    </div>
    <div class="row">
      <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="a**le" aria-label="Pattern">
      <button type="button" class="go" id="go" disabled>Search</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <div id="status" role="status" aria-live="polite">Loading wordfreq.txt…</div>
  <ul id="results"></ul>
  <button type="button" class="more" id="more" hidden></button>
</main>

<script>
(() => {
  const PAGE = 2000;           // words rendered per batch, keeps huge result sets responsive
  const $ = id => document.getElementById(id);
  const q = $('q'), go = $('go'), statusEl = $('status'), list = $('results'),
        more = $('more'), hint = $('hint');
  const modeBtns = { filter: $('mode-filter'), length: $('mode-length'), includes: $('mode-includes'), soft: $('mode-soft') };

  let words = [];              // [{ w: 'word', f: 0-100, o: opacity }], file order = frequency descending
  let mode = 'filter';
  let matches = [];
  let shown = 0;

  const modes = {
    filter: {
      placeholder: 'a**le',
      hint: 'Pattern is a regex matched against the whole word. <code>*</code> means exactly one letter, same as filter.py.',
    },
    length: {
      placeholder: '5',
      hint: 'Enter a number to list every word with exactly that many letters.',
    },
    includes: {
      placeholder: 'spring',
      hint: 'Words that contain these letters together, in this exact order, anywhere in the word.',
    },
    soft: {
      placeholder: 'spring',
      hint: 'Words containing these letters in order but not side by side, like <code>surprising</code> for <code>spring</code>. Words that contain the text directly (<code>springing</code>) are excluded.',
    },
  };

  function setMode(m) {
    mode = m;
    for (const k in modeBtns) modeBtns[k].setAttribute('aria-pressed', String(k === m));
    q.placeholder = modes[m].placeholder;
    hint.innerHTML = modes[m].hint;
    q.inputMode = m === 'length' ? 'numeric' : 'text';
    q.focus();
  }

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.classList.toggle('error', !!isError);
  }

  function renderBatch() {
    const frag = document.createDocumentFragment();
    const end = Math.min(shown + PAGE, matches.length);
    for (let i = shown; i < end; i++) {
      const li = document.createElement('li');
      li.textContent = matches[i].w;
      li.title = 'frequency ' + matches[i].f;
      li.style.opacity = matches[i].o;
      frag.appendChild(li);
    }
    list.appendChild(frag);
    shown = end;
    if (shown < matches.length) {
      more.hidden = false;
      more.textContent = `Show ${Math.min(PAGE, matches.length - shown).toLocaleString()} more (${shown.toLocaleString()} of ${matches.length.toLocaleString()} shown)`;
    } else {
      more.hidden = true;
    }
  }

  // true if every character of `needle` appears in `hay` in order (gaps allowed)
  function isSubsequence(needle, hay) {
    let i = 0;
    for (let j = 0; j < hay.length && i < needle.length; j++) {
      if (hay[j] === needle[i]) i++;
    }
    return i === needle.length;
  }

  function run() {
    list.textContent = '';
    more.hidden = true;
    matches = []; shown = 0;
    const raw = q.value.trim();
    if (!raw) { setStatus('Enter something to search.', true); return; }

    if (mode === 'filter') {
      let re;
      try {
        // mirrors filter.py: lowercase, '*' -> '.', full match
        re = new RegExp('^(?:' + raw.toLowerCase().replace(/\*/g, '.') + ')$');
      } catch (e) {
        setStatus('Invalid pattern: ' + e.message, true);
        return;
      }
      matches = words.filter(e => re.test(e.w.toLowerCase()));
    } else if (mode === 'includes') {
      const needle = raw.toLowerCase();
      matches = words.filter(e => e.w.toLowerCase().includes(needle));
    } else if (mode === 'soft') {
      const needle = raw.toLowerCase();
      matches = words.filter(e => {
        const w = e.w.toLowerCase();
        return !w.includes(needle) && isSubsequence(needle, w);
      });
    } else {
      const n = parseInt(raw, 10);
      if (!Number.isInteger(n) || n < 0) { setStatus('Length must be a whole number.', true); return; }
      matches = words.filter(e => e.w.length === n);
    }

    setStatus(matches.length === 0
      ? 'No matches.'
      : `${matches.length.toLocaleString()} ${matches.length === 1 ? 'word' : 'words'}`);
    renderBatch();
  }

  // Opacity runs from MIN_OPACITY (freq 0) to 1 (freq 100).
  // Linear, so a word at freq 50 sits about halfway between.
  const MIN_OPACITY = 0.3;
  function opacityFor(f) {
    return +(MIN_OPACITY + (1 - MIN_OPACITY) * (f / 100)).toFixed(3);
  }

  // Lines look like "word;23". Split on the LAST ';' and keep only the word part.
  function parse(text) {
    const out = [];
    for (const line of text.split('\n')) {
      const t = line.trim();
      if (!t) continue;
      const i = t.lastIndexOf(';');
      const w = (i === -1 ? t : t.slice(0, i)).trim();
      let f = i === -1 ? 0 : parseFloat(t.slice(i + 1));
      if (!Number.isFinite(f)) f = 0;
      f = Math.min(100, Math.max(0, f));
      if (w) out.push({ w, f, o: opacityFor(f) });
    }
    return out;
  }

  async function load() {
    try {
      const res = await fetch('wordfreq.txt');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      words = parse(text);
      go.disabled = false;
      setStatus(`Loaded ${words.length.toLocaleString()} words. Ready.`);
    } catch (e) {
      setStatus('Could not load wordfreq.txt (' + e.message + '). Keep it next to this file and serve over http(s), not file://.', true);
    }
  }

  modeBtns.filter.addEventListener('click', () => setMode('filter'));
  modeBtns.length.addEventListener('click', () => setMode('length'));
  modeBtns.includes.addEventListener('click', () => setMode('includes'));
  modeBtns.soft.addEventListener('click', () => setMode('soft'));
  go.addEventListener('click', run);
  more.addEventListener('click', renderBatch);
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && !go.disabled) run(); });

  setMode('filter');
  load();
})();
</script>
</body>
</html>
